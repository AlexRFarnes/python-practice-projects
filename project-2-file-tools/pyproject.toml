[project]
name = "project-2-file-tools"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.MAIN]
# Lets pylint resolve local imports (e.g. `from tasks import ...` in tests/)
# regardless of which file/subfolder it's invoked from, by adding this
# pyproject.toml's own directory to sys.path.
init-hook = 'import sys, os; from pylint.config import find_default_config_files; cfgs = list(find_default_config_files()); sys.path.insert(0, os.path.dirname(str(cfgs[0]))) if cfgs else None'
